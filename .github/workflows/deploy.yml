name: Deploy to dreamcompute-leo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DREAMCOMPUTE_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan root.noshado.ws >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          git remote add dreamcompute-leo leo@root.noshado.ws:/home/leo/full-stack-apps/cloud
          git push dreamcompute-leo main

      - name: Restart server
        run: |
          ssh leo@root.noshado.ws "export NVM_DIR=\$HOME/.nvm && [ -s \$NVM_DIR/nvm.sh ] && . \$NVM_DIR/nvm.sh && cd /home/leo/full-stack-apps/cloud && npm install --no-save && npm run build && pm2 restart cloud"